version: '3'

# This repo's real tasks live in site/Taskfile.yml (owner-owned, like every
# other file under site/), so the engine's own fandom-neutrality check
# (test/purity.test.js) and the site's name-leak guard
# (site/test/engineNeutral.test.js) never need to know this file exists,
# and an engine merge can never conflict with it.
#
# `flatten: true` includes those tasks under their own plain names (no
# `site:` namespace prefix), so `task --list` from the repo root shows
# every task exactly as site/Taskfile.yml defines it. Requires Task
# v3.39.0+ (installed here: 3.53.1) -- the go-task changelog's v3.39.0
# entry (2024-09-07) reads: "Added an option to declare an included
# Taskfile as flattened" (#1704)
# (https://raw.githubusercontent.com/go-task/task/main/CHANGELOG.md; the
# same option is documented, without a version, at
# https://taskfile.dev/reference/schema under `includes.<name>.flatten`).
#
# `dir: .` makes every included task's commands run from this file's own
# directory -- the repo root -- rather than from site/, which is where
# site/Taskfile.yml itself lives
# (https://taskfile.dev/reference/schema: `includes.<name>.dir`,
# "Working directory for included tasks"; confirmed directly against the
# installed `task`: a task's `pwd` prints the repo root, not site/).

includes:
  site:
    taskfile: ./site/Taskfile.yml
    dir: .
    flatten: true
