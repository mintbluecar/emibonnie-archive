name: CI

# Pull requests run with the fork's own read-only token. Never use
# pull_request_target here: it would run fork code with this repo's secrets.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:a63c1ea3f6a3a5a1621f97d2aba3b30faecfab4224c1b0000cc85ced57bb1939
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The Neon driver connects over WebSocket; Neon's wsproxy forwards to the postgres service.
      wsproxy:
        image: ghcr.io/neondatabase/wsproxy@sha256:7f2e2149aa6a57ba382a140102fba44f5053f3e44389ccc18adcecf896054efb
        env:
          APPEND_PORT: postgres:5432
          ALLOW_ADDR_REGEX: '.*'
          LOG_TRAFFIC: 'false'
        ports:
          - 5433:80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # test/site/themeTokens.test.js renders the built CSS in Chromium to check the real cascade.
      - run: npx playwright install --with-deps chromium
      - run: npm run init-site
      - run: npm run build
      - run: npm run check
      - name: npm test (PGlite)
        run: npm test
      - name: npm test (Postgres 17)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          TEST_WS_PROXY: localhost:5433

  e2e:
    # Plan 1b Task 7: Playwright smoke + axe checks. PGlite only -- the
    # dev server this job's webServer starts (playwright.config.js)
    # needs no Postgres service.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run init-site
      - run: npx playwright install --with-deps chromium
      # Writes the generated kinds registries that seed-dev (the e2e webServer) imports.
      - run: npm run build
      - run: npm run e2e
      # Task 9a item 1: the site checks on the init-site copy, so e2e/site.spec.js keeps working.
      - run: npm run e2e:site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
