version: '3'

# A discoverable front end over site/scripts/deploy.sh, site/scripts/create-app-role.sh,
# site/scripts/check-app-role.sh and the usual npm scripts, for the owner to
# browse with `task --list` and run from the repo root. Nothing here does
# anything those scripts don't already do on their own -- see
# site/docs/deploy.md for the step-by-step runbook, which shows the `task`
# command for each step with the raw command underneath it.
#
# Secrets: no task below ever puts a database URL into a Task `vars:` entry,
# or into any text Task would run through its own `{{ }}` templating.
# Task's templating engine is Go's text/template, and only applies inside
# `{{` / `}}`: "Most string values in Task can be templated using double
# curly braces `{{` and `}}`" (https://taskfile.dev/reference/schema). A
# plain shell-style reference such as `$EMIBONNIE_DB` has no `{{ }}` in it,
# so Task's templating never touches it -- it's passed straight through as
# literal text to the shell that runs the command, and *that* shell (never
# Task) expands it, only once the command is actually executed. That also
# means it's the literal, unexpanded text Task prints before running a
# command (unless `silent: true`): confirmed directly against the
# installed `task` 3.53.1 (`MY_SECRET=topsecret task default_echo` with
# `cmds: [echo "value is $MY_SECRET"]` prints `task: [default_echo] echo
# "value is $MY_SECRET"`, then the command's own output -- the echoed
# command line itself never shows the value), since the schema reference
# page doesn't spell this out explicitly. Every task below that references
# `$EMIBONNIE_DB`/`$EMIBONNIE_DB_PREVIEW` directly in its own `cmds:` text
# still sets `silent: true`, as defence in depth -- Task's own CLI
# reference warns "silent mode is not a substitute for secret masking"
# (https://taskfile.dev/reference/cli) -- but the real protection is never
# letting Task template a secret in the first place, same rule
# site/scripts/deploy.sh's own header comment follows.
#
# Every task that needs a database URL guards it with `preconditions:`, so
# `task <name>` fails with a clear message instead of running the
# underlying script and letting *that* refuse (which it still would).
#
# The tasks that touch a real database destructively -- `setup:prod`,
# `role:prod`, `role:rotate:preview`, `role:rotate:prod`, `deploy:prod` and
# `takedown` -- also set `prompt:`, on top of each script's own typed
# confirmation. In a non-interactive shell (no TTY, as in a test), Task
# cancels a prompted task unless `--yes`/`-y` is passed: "Task ...
# cancelled because it has a prompt and the environment is not a
# terminal. Use --yes (-y) to run anyway." (confirmed directly against the
# installed `task`, and matches `-y, --yes`: "Automatically answer 'yes'
# to all prompts" in https://taskfile.dev/reference/cli).
#
# Fix round 3, I-T: a user-supplied *value* (`takedown`'s id) must never
# be spliced into shell text via `{{ }}` either -- Task's templating runs
# before the shell ever sees the result, so a value containing shell
# metacharacters would be parsed as shell syntax, not data, exactly like
# an unsanitised string concatenated into a SQL query. `takedown` is the
# only task that takes such a value, and it carries it through `env:`
# instead (a real environment variable the shell reads with `$NAME`),
# with a `preconditions.sh` that rejects anything but digits before any
# `cmds:` runs. See that task's own comment for exactly how this was
# confirmed (two injection payloads, against the installed `task`).

tasks:
  setup:preview:
    desc: "Setup + seed-dev against the preview branch, granting app"
    summary: |
      Runs `npm run setup` then `npm run seed-dev` against the Neon
      `preview` branch, with APP_DB_ROLE=app so the app role is
      (re-)granted. Needs EMIBONNIE_DB_PREVIEW set in your shell. See
      site/docs/deploy.md, section 2, step 2.
    silent: true
    preconditions:
      - sh: 'test -n "$EMIBONNIE_DB_PREVIEW"'
        msg: "EMIBONNIE_DB_PREVIEW is not set -- export the preview branch's owner-role connection string first."
    cmds:
      - DATABASE_URL="$EMIBONNIE_DB_PREVIEW" APP_DB_ROLE=app npm run setup
      - DATABASE_URL="$EMIBONNIE_DB_PREVIEW" APP_DB_ROLE=app npm run seed-dev

  setup:prod:
    desc: "Setup + seed-dev against the main branch, granting app"
    summary: |
      Same as setup:preview, against the main branch. Needs EMIBONNIE_DB
      set in your shell. Asks for confirmation first -- this touches the
      production database.
    silent: true
    prompt: "This runs setup/seed-dev against the PRODUCTION database. Continue?"
    preconditions:
      - sh: 'test -n "$EMIBONNIE_DB"'
        msg: "EMIBONNIE_DB is not set -- export the main branch's owner-role connection string first."
    cmds:
      - DATABASE_URL="$EMIBONNIE_DB" APP_DB_ROLE=app npm run setup
      - DATABASE_URL="$EMIBONNIE_DB" APP_DB_ROLE=app npm run seed-dev

  role:preview:
    desc: "Create the least-privilege 'app' role on the preview branch"
    summary: |
      Runs site/scripts/create-app-role.sh. Needs EMIBONNIE_DB_PREVIEW set.
      Refuses if the role already exists; see site/docs/deploy.md,
      section 6(a), to rotate its password instead.
      The new password goes to Neon in plaintext over TLS (Neon requires
      it and stores it encrypted); it is never printed. See
      site/docs/deploy.md, section 1(a).
    preconditions:
      - sh: 'test -n "$EMIBONNIE_DB_PREVIEW"'
        msg: "EMIBONNIE_DB_PREVIEW is not set -- export the preview branch's owner-role connection string first."
    cmds:
      - site/scripts/create-app-role.sh

  role:prod:
    desc: "Create the least-privilege 'app' role on the main branch"
    summary: |
      Runs site/scripts/create-app-role.sh --prod. Needs EMIBONNIE_DB set.
      Asks for confirmation first.
      The new password goes to Neon in plaintext over TLS (Neon requires
      it and stores it encrypted); it is never printed. See
      site/docs/deploy.md, section 1(a).
    prompt: "This creates the 'app' role on the PRODUCTION branch. Continue?"
    preconditions:
      - sh: 'test -n "$EMIBONNIE_DB"'
        msg: "EMIBONNIE_DB is not set -- export the main branch's owner-role connection string first."
    cmds:
      - site/scripts/create-app-role.sh --prod

  role:rotate:preview:
    desc: "Rotate the 'app' role's password on the preview branch"
    summary: |
      Runs site/scripts/create-app-role.sh --rotate. Needs
      EMIBONNIE_DB_PREVIEW set. Replaces the preview-scope DATABASE_URL
      Secret in Vercel (one `vercel env update`). The live preview site
      can't reach the database until a redeploy finishes: run `task
      deploy:preview` straight after. Use this for a leaked secret (fix
      round 3, C1) -- never reset the password from the Neon console,
      which would put 'app' back into neon_superuser.
      The new password goes to Neon in plaintext over TLS (Neon requires
      it and stores it encrypted); it is never printed. See
      site/docs/deploy.md, section 1(a).
    prompt: "This rotates the 'app' role's password on preview, and replaces the Vercel Secret. Continue?"
    preconditions:
      - sh: 'test -n "$EMIBONNIE_DB_PREVIEW"'
        msg: "EMIBONNIE_DB_PREVIEW is not set -- export the preview branch's owner-role connection string first."
    cmds:
      - site/scripts/create-app-role.sh --rotate

  role:rotate:prod:
    desc: "Rotate the 'app' role's password on the main branch"
    summary: |
      Runs site/scripts/create-app-role.sh --rotate --prod. Needs
      EMIBONNIE_DB set. Replaces the production-scope DATABASE_URL Secret
      in Vercel (one `vercel env update`). The live site can't reach the
      database until a redeploy finishes: run `task deploy:prod` straight
      after. Use this for a leaked secret (fix round 3, C1) -- never reset
      the password from the Neon console, which would put 'app' back
      into neon_superuser.
      The new password goes to Neon in plaintext over TLS (Neon requires
      it and stores it encrypted); it is never printed. See
      site/docs/deploy.md, section 1(a).
    prompt: "This rotates the 'app' role's password on PRODUCTION, and replaces the Vercel Secret. Continue?"
    preconditions:
      - sh: 'test -n "$EMIBONNIE_DB"'
        msg: "EMIBONNIE_DB is not set -- export the main branch's owner-role connection string first."
    cmds:
      - site/scripts/create-app-role.sh --rotate --prod

  check-role:preview:
    desc: "Least-privilege check for 'app' on the preview branch"
    preconditions:
      - sh: 'test -n "$EMIBONNIE_DB_PREVIEW"'
        msg: "EMIBONNIE_DB_PREVIEW is not set -- export the preview branch's owner-role connection string first."
    cmds:
      - site/scripts/check-app-role.sh

  check-role:prod:
    desc: "Least-privilege check for 'app' on the main branch"
    preconditions:
      - sh: 'test -n "$EMIBONNIE_DB"'
        msg: "EMIBONNIE_DB is not set -- export the main branch's owner-role connection string first."
    cmds:
      - site/scripts/check-app-role.sh --prod

  deploy:preview:
    desc: "Deploy a preview build against the preview branch"
    preconditions:
      - sh: 'test -n "$EMIBONNIE_DB_PREVIEW"'
        msg: "EMIBONNIE_DB_PREVIEW is not set -- export the preview branch's owner-role connection string first."
    cmds:
      - site/scripts/deploy.sh

  deploy:prod:
    desc: "Deploy to production with the full checks (a release)"
    summary: |
      Runs site/scripts/deploy.sh --prod. deploy.sh asks for 'yes' once,
      before any check runs (a typo just asks again). See
      site/docs/deploy.md, section 2.
    preconditions:
      - sh: 'test -n "$EMIBONNIE_DB"'
        msg: "EMIBONNIE_DB is not set -- export the main branch's owner-role connection string first."
    cmds:
      - site/scripts/deploy.sh --prod

  deploy:quick:
    desc: "Fast preview deploy: skips the heavy checks, for iterating"
    summary: |
      Runs site/scripts/deploy.sh --quick against the preview branch. Skips
      npm ci (when node_modules exists), npm run check, npm test and
      e2e:site. Still builds, runs the name-leak guard, migrates, checks the
      app role, and stops if the repo's files change mid-run.
    preconditions:
      - sh: 'test -n "$EMIBONNIE_DB_PREVIEW"'
        msg: "EMIBONNIE_DB_PREVIEW is not set -- export the preview branch's owner-role connection string first."
    cmds:
      - site/scripts/deploy.sh --quick

  deploy:quick-prod:
    desc: "Fast production deploy: skips the heavy checks (use with care)"
    summary: |
      Runs site/scripts/deploy.sh --prod --quick. Same skips as deploy:quick,
      against production. Use it for small fixes you've already seen working
      on a preview; use deploy:prod for releases.
    preconditions:
      - sh: 'test -n "$EMIBONNIE_DB"'
        msg: "EMIBONNIE_DB is not set -- export the main branch's owner-role connection string first."
    cmds:
      - site/scripts/deploy.sh --prod --quick

  deploy:dry:
    desc: "Dry run of the preview deploy (no network, no real commands)"
    preconditions:
      - sh: 'test -n "$EMIBONNIE_DB_PREVIEW"'
        msg: "EMIBONNIE_DB_PREVIEW is not set -- export the preview branch's owner-role connection string first."
    cmds:
      - site/scripts/deploy.sh --dry-run

  deploy:dry-prod:
    desc: "Dry run of the production deploy (no network, no real commands)"
    preconditions:
      - sh: 'test -n "$EMIBONNIE_DB"'
        msg: "EMIBONNIE_DB is not set -- export the main branch's owner-role connection string first."
    cmds:
      - site/scripts/deploy.sh --prod --dry-run

  backup:
    desc: "pg_dump the main branch into ~/emibonnie-backups"
    summary: |
      Runs the manual backup command from site/docs/deploy.md, section 5.
      Needs EMIBONNIE_DB set. Uses Postgres 17 client tools (pg_dump).
    silent: true
    preconditions:
      - sh: 'test -n "$EMIBONNIE_DB"'
        msg: "EMIBONNIE_DB is not set -- export the main branch's owner-role connection string first."
    cmds:
      - mkdir -p "$HOME/emibonnie-backups"
      - chmod 700 "$HOME/emibonnie-backups"
      - pg_dump --format=custom --file="$HOME/emibonnie-backups/$(date +%F)-main.dump" --dbname="$EMIBONNIE_DB"

  test:
    desc: "npm test, plus this site's own test/ (name-leak guard, deploy scripts)"
    cmds:
      - npm test
      - node --test site/test/

  check:
    desc: "tsc + eslint (npm run check)"
    cmds:
      - npm run check

  e2e:site:
    desc: "Build site/ and check its real pages (npm run e2e:site)"
    cmds:
      - npm run e2e:site

  dev:
    desc: "Local site at http://localhost:3000 with this archive's real data; rebuilds on file changes (no Neon, no Vercel)"
    summary: |
      Runs the site on this Mac against a local database in .devdb
      (gitignored), seeded from site/seed the first time. Nothing touches
      Neon or Vercel. It rebuilds whenever a file changes -- refresh the
      browser to see it. `task dev:fresh` also resets the local data.
    env:
      PGLITE_DIR: .devdb
      DATABASE_URL: ''
      VERCEL: ''
    cmds:
      - test -d .devdb || npm run seed-dev
      - npm run dev:watch

  dev:fresh:
    desc: "Like dev, but wipes and re-seeds the local data first"
    env:
      PGLITE_DIR: .devdb
      DATABASE_URL: ''
      VERCEL: ''
    cmds:
      - rm -rf .devdb
      - npm run seed-dev
      - npm run dev:watch

  dev:pull:
    desc: "Replace .devdb with a copy of production's data (only reads production)"
    summary: |
      Runs `npm run pull-prod` (scripts/pullProd.js) against $EMIBONNIE_DB:
      rebuilds .devdb from this checkout's migrations and copies every
      table except login sessions and rate limits. Stops if production
      applied different migrations. Then `task dev:as -- owner`.
    silent: true
    preconditions:
      - sh: 'test -n "$EMIBONNIE_DB"'
        msg: "EMIBONNIE_DB is not set -- export the main branch's connection string first."
    env:
      PGLITE_DIR: .devdb
      VERCEL: ''
    cmds:
      - DATABASE_URL="$EMIBONNIE_DB" npm run pull-prod

  dev:as:
    desc: "Like dev, signed in as a role: task dev:as -- owner|translator|member|google|guest"
    summary: |
      Runs `task dev` with DEV_AS set, so the first page you open signs you
      in as that role (scripts/dev.js). Switch while it runs with
      `task dev:switch -- <role>`. Run `task dev:pull` first for real data.
    # The role goes through `env:`, never `{{ }}` in shell text (see takedown), and must be one of the five.
    env:
      DEV_AS: '{{.ROLE | default .CLI_ARGS}}'
      PGLITE_DIR: .devdb
      DATABASE_URL: ''
      VERCEL: ''
    preconditions:
      - sh: '[[ $DEV_AS =~ ^(owner|translator|member|google|guest)$ ]]'
        msg: "Pick a role: task dev:as -- owner|translator|member|google|guest"
    cmds:
      - test -d .devdb || npm run seed-dev
      - npm run dev:watch

  screens:
    desc: "Screenshots of every page for every role on .devdb, into .screens/"
    summary: |
      Runs `npm run screens -- --db .devdb`: every page as owner, translator,
      member and guest, at 390px and 1280px, light and dark, with an index at
      .screens/index.html. .devdb may be a copy of production (task dev:pull),
      so .screens/ is gitignored -- never commit or share it.
    env:
      PGLITE_DIR: .devdb
      DATABASE_URL: ''
      VERCEL: ''
    preconditions:
      - sh: 'test -d .devdb'
        msg: "No .devdb yet -- run task dev:pull (real data) or task dev (sample data) first."
    cmds:
      - npm run screens -- --db .devdb

  dev:switch:
    desc: "Switch the running local site's role in your browser: task dev:switch -- <role> [handle]"
    summary: |
      Opens http://localhost:3000/api/auth/dev?as=<role> (PORT overrides
      3000), which signs the browser in as that role and lands on /me. For a
      particular translator: task dev:switch -- translator <x handle>.
    env:
      DEV_SWITCH_ARGS: '{{.CLI_ARGS}}'
    preconditions:
      - sh: '[[ $DEV_SWITCH_ARGS =~ ^(owner|translator|member|google|guest)( [A-Za-z0-9_]{1,15})?$ ]]'
        msg: "Pick a role: task dev:switch -- owner|translator|member|google|guest (translator may add an X handle)"
    cmds:
      - |
        set -- $DEV_SWITCH_ARGS
        url="http://localhost:${PORT:-3000}/api/auth/dev?as=$1&returnTo=/me${2:+&handle=$2}"
        echo "$url"
        open "$url"

  takedown:
    desc: "Hide one item by its /t/<id> numeric id: task takedown -- <id> (or ID=<id>)"
    summary: |
      Runs the exact statement from site/docs/deploy.md, section 6(b),
      against $EMIBONNIE_DB, passing the id as a psql variable (-v
      id=...) -- never interpolated into the SQL text. Prints the
      UPDATE result and reminds you to purge the CDN cache for an
      urgent request. Needs EMIBONNIE_DB set, and the id: either
      `task takedown -- <id>` or `ID=<id> task takedown`.
    silent: true
    prompt: "This hides an item on PRODUCTION. Continue?"
    # Fix round 3, I-T: the id goes through `env:`, never through `{{ }}`
    # inside a `cmds:`/`preconditions.sh` *string*. `env:` turns a
    # template value into a real OS environment variable for the task's
    # shell to read with `$TAKEDOWN_ID` -- the one safe way to carry an
    # argument into shell text here. An earlier draft used
    # `vars: { ITEM_ID: '{{.ID | default .CLI_ARGS}}' }` and then wrote
    # `{{.ITEM_ID}}` straight into a `preconditions.sh` string and into
    # the heredoc below: Task's `{{ }}` templating runs *before* the
    # shell ever sees the text, splicing the id's literal characters into
    # what becomes a shell command line -- so an id of `1"; touch X; echo
    # "` or `$(touch X)` would have been parsed as shell syntax, not data.
    # Confirmed both ways against a scratch Taskfile with the installed
    # `task`: with `{{.ITEM_ID}}`, both payloads ran their embedded
    # command; with `env: TAKEDOWN_ID` plus the digits-only precondition
    # below plus `"$TAKEDOWN_ID"` (always quoted) in the heredoc, both are
    # rejected by the precondition and touch nothing -- as is a multi-line
    # id (fix round 4, N2; see the precondition's own comment).
    env:
      TAKEDOWN_ID: '{{.ID | default .CLI_ARGS}}'
    preconditions:
      - sh: 'test -n "$EMIBONNIE_DB"'
        msg: "EMIBONNIE_DB is not set -- export the main branch's owner-role connection string first."
      # Fix round 4, N2: a whole-string bash pattern test, not `grep -x`.
      # grep matches line by line, so `printf %s "$TAKEDOWN_ID" | grep -Eqx
      # "[0-9]+"` accepted `123<newline>$(touch X)` -- its first line is all
      # digits. (Through `--`, Task shell-quotes CLI_ARGS, which happened to
      # stop that; `task takedown ID=...` and `ID=... task takedown` carried
      # the newline through untouched -- confirmed against task 3.53.1.)
      # `=~` with `^...$` anchors the whole value; Task's own shell
      # interpreter (mvdan/sh) supports `[[ ]]`.
      - sh: '[[ $TAKEDOWN_ID =~ ^[0-9]+$ ]]'
        msg: "Pass a numeric tweet id only: task takedown -- <id>, or ID=<id> task takedown."
    cmds:
      - |
        psql "$EMIBONNIE_DB" -v ON_ERROR_STOP=1 -v id="$TAKEDOWN_ID" <<'SQL'
        begin;
        select set_config('app.actor', 'system', true);

        update items
        set deleted_at = now(),
            deleted_by = 'system',
            deleted_reason = 'hidden_by_owner'
        where id = (
          select item_id from item_sources
          where platform = 'x'
            and external_id = :'id'
            and role = 'primary'
            and kind = 'translation'
        );

        commit;
        SQL
      - 'echo "If this is urgent, also purge the Vercel CDN cache now: task purge (site/docs/deploy.md, section 6(b))."'

  purge:
    desc: "Purge the Vercel CDN cache (use after an urgent takedown)"
    summary: |
      Runs `vercel cache purge --type cdn`
      (https://vercel.com/docs/cli/cache), pinned to the same CLI version
      as the scripts (see the header comment, M4). Public pages are
      cached for up to 5 minutes (s-maxage=300); without this, a
      just-hidden item can keep being served from cache for that long.
      Dashboard fallback: the project's "..." menu -> Data Cache (or CDN)
      -> Purge Cache.
    cmds:
      - npx --yes vercel@65.1.0 cache purge --type cdn
